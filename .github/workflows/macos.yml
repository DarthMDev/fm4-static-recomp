name: macOS preview checks and packaging

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-and-package:
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'macos-ci')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check runner and tagged inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          test "$(sysctl -n hw.pagesize)" = 16384
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          mac = json.loads(Path('config/macos-toolchain.json').read_text())
          release = json.loads(Path('config/release.json').read_text())
          assert mac['minimum_macos'] == '14.0'
          if os.environ['EVENT_NAME'] == 'push':
              assert 'sdk' not in mac, 'Release requires the approved shared SDK pin'
              assert os.environ['REF_NAME'] == 'v' + release['version']
          PY
          xcrun --find clang
          xcrun --find clang++
          xcrun --sdk macosx --show-sdk-path
          cmake --version
          ninja --version
          dotnet --version
          python3 --version
      - name: Launcher tests
        run: dotnet test launcher/Fm4StaticRecomp.Launcher.sln -c Release
      - name: Python tests
        run: python3 -m unittest discover -s tools/tests
      - name: Prepare exact configured SDK
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from mac_sdk import prepare_sdk
          sdk, identity = prepare_sdk(Path.cwd())
          receipt = Path('out/ci-evidence/macos-sdk-identity.json')
          receipt.parent.mkdir(parents=True, exist_ok=True)
          receipt.write_text(json.dumps(identity, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'REXSDK_DIR={sdk}\n')
          PY
      - name: Configure native and SDK tests without game files
        run: |
          cmake -S . -B out/ci-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$(xcrun --find clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun --find clang++)" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DREXSDK_DIR="$REXSDK_DIR" \
            -DFM4_TESTS_ONLY=ON -DFM4_BUILD_MACOS_MEMORY_TESTS=ON \
            -DREXGLUE_BUILD_TESTS=ON -DREXGLUE_USE_VULKAN=ON \
            -DREXGLUE_USE_D3D12=OFF -DREXGLUE_ENABLE_TRACY=OFF \
            -DSDL_HIDAPI_LIBUSB=OFF \
            -DREXGLUE_FFX_API_LOADER=ON -DREXGLUE_FIDELITYFX_RUNTIME=ON
      - name: Build and run native tests
        run: |
          cmake --build out/ci-macos --target fm4_unit_tests fm4_macos_page_watch_test unit_tests --parallel 3
          out/ci-macos/fm4-tests/fm4_unit_tests
          out/ci-macos/fm4_macos_page_watch_test
          out/ci-macos/rexglue-artifacts/unit_tests
      - name: Package and verify game-free launcher
        run: |
          python3 tools/package-launcher-macos.py --output-dir out/ci-package
          cd out/ci-package
          shasum -a 256 -c FM4StaticRecomp-Launcher-macos-arm64.zip.sha256
      - name: Retain build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FM4StaticRecomp-Launcher-macos-arm64-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/ci-package/FM4StaticRecomp-Launcher-macos-arm64.zip
            out/ci-package/FM4StaticRecomp-Launcher-macos-arm64.zip.sha256
            out/ci-evidence/macos-sdk-identity.json
